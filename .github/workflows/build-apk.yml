name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | head -n 1 | cut -d'"' -f2 | cut -d'.' -f1)
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_VERSION) is lower than 17"
            exit 1
          fi
          echo "Java major version ($JAVA_VERSION) verified (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "debug.keystore missing. Generating temporary keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f ./debug.keystore ]; then
            echo "Error: ./debug.keystore could not be created."
            exit 1
          fi
          echo "Confirmed: ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK output
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Found expected APK at app/build/outputs/apk/debug/app-debug.apk"
          else
            echo "Error: Expected debug APK missing at app/build/outputs/apk/debug/app-debug.apk"
            echo "Searching inside app/build/outputs/apk..."
            if [ -d app/build/outputs/apk ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
